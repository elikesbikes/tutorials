version: "3.8"
services:
  wyl:
    image: aceberg/watchyourlan
    network_mode: host
    restart: unless-stopped
    ports:
      - 8840:8840
    environment:
      - IFACES=${WYL_IFACE}
      - HOST=0.0.0.0
      - PORT=8840
      - SHOUTRRR_URL=ntfy://ntfy.home.elikesbikes.com/lan
    volumes:
      - ./wyl:/data/WatchYourLAN
networks: {}
