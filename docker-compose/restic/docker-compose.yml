services:
  restic:
    # Pinned to the restic version baked in by the Dockerfile (RESTIC_VERSION). When this tag is not on the host yet,
    # `docker compose up -d` (start.sh) builds it from `build: .`; bump both together on an upgrade.
    image: ecloaiza/restic-backup:0.19.1
    build: .
    container_name: restic
    hostname: ${CONTAINER_HOSTNAME:-ranger0}
    restart: unless-stopped
    env_file:
      - .env
    # The repository password comes from Proton Pass via start.sh (never .env); compose forwards it by name. start.sh withholds it
    # unless ./backup is an NFS mount, so this cannot make backup.sh `restic init` a repository on a local disk.
    environment:
      - RESTIC_PASSWORD
    volumes:
      # App code now lives IN the image (COPY app/ in the Dockerfile). To pick
      # up code changes, rebuild: `docker compose up -d --build`.

      # Job definitions — one .conf per backup job (see jobs/example.conf.example)
      - ./jobs:/app/jobs:ro

      # Logs and per-job status files — writable, shared with host restic-status.sh
      - ./logs:/app/logs

      # Data sources are HOST-SPECIFIC and live in docker-compose.override.yml
      # (merged automatically by docker compose). This base file stays identical
      # across hosts. See docker-compose.override.yml.example.

      # Restic repository — symlink → NFS mount managed by host nfs-auto-mount.sh
      - ./backup:/backup

      # Timezone consistency
      - /etc/localtime:/etc/localtime:ro

    # No host port published — the status API (8484) is reached only through
    # Traefik at RESTIC_TRAEFIK_HOST. Traefik talks to the container over the shared
    # `frontend` network; the container still listens on 8484 internally.
    # Point Uptime Kuma at https://${RESTIC_TRAEFIK_HOST}/health instead of host:8484.

    networks:
      - default

    # Reverse-proxy the status UI/API through Traefik at the host-specific
    # hostname in RESTIC_TRAEFIK_HOST (e.g. restic-tars.home.elikesbikes.com). It
    # lives in each host's .env so this base file stays identical across hosts —
    # same pattern as Traefik's own TRAEFIK_DASHBOARD_HOST. Traefik reaches the
    # container over the shared `frontend` network on port 8484.
    # NEVER name it RESTIC_HOST: restic >= 0.17 reads RESTIC_HOST as the snapshot host
    # name (backup/snapshots/forget), and .env is passed into the container (2026-10-08).
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.restic.rule=Host(`${RESTIC_TRAEFIK_HOST:?set RESTIC_TRAEFIK_HOST in .env}`)"
      - "traefik.http.routers.restic.entrypoints=websecure"
      - "traefik.http.routers.restic.tls.certresolver=production"
      - "traefik.http.routers.restic.middlewares=security-headers@file"
      - "traefik.http.services.restic.loadbalancer.server.port=8484"

    # Ship container stdout to the homelab Graylog syslog server. Backup/cleanup
    # job output reaches stdout via the /proc/1/fd/1 routing in entrypoint.sh,
    # so scheduled runs land in Graylog too (not just entrypoint/status-api).
    # `docker compose logs` still works locally thanks to Docker's dual-logging
    # cache (Engine 20.10+), so logs are available in both places.
    logging:
      driver: syslog
      options:
        # Graylog runs on hailmary (192.168.5.25); endurance (.30) and ranger0 (.16) are
        # retired. Per-host override via SYSLOG_ADDRESS in .env, same as the other projects.
        syslog-address: "${SYSLOG_ADDRESS:-udp://192.168.5.25:514}"
        # Match the RFC3164 format the hosts/router already send (Graylog's
        # Syslog input parses it); Docker's default rfc5424 was not ingested.
        syslog-format: "rfc3164"
        tag: "restic"

networks:
  default:
    name: frontend
    external: true
