services:
  app:
    # Pin the version here during upgrades.
    # Current path: 32.0.1 (on NFS) → start at 33 → then bump to latest (34).
    image: nextcloud:latest
    container_name: nextcloud_app
    restart: unless-stopped
    networks:
      - frontend
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.nextcloud.rule=Host(`${NC_DOMAIN}`)"
      - "traefik.http.routers.nextcloud.entrypoints=websecure"
      - "traefik.http.routers.nextcloud.tls=true"
      - "traefik.http.routers.nextcloud.tls.certresolver=production"
      - "traefik.http.services.nextcloud.loadbalancer.server.port=80"
    volumes:
      - ${NEXTCLOUD_DIR}:/var/www/html
      - ${DATA_DIR}:/var/www/html/data
    environment:
      - TZ=America/Los_Angeles
      - MYSQL_HOST=db
      - MYSQL_DATABASE=${DB_NAME}
      - MYSQL_USER=${DB_USER}
      - MYSQL_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_HOST_PORT=6379
      - NEXTCLOUD_TRUSTED_DOMAINS=localhost 127.0.0.1 ${NC_DOMAIN}
      - OVERWRITEHOST=${NC_DOMAIN}
      - OVERWRITEPROTOCOL=https
      # Trust Docker bridge subnet so Traefik's forwarded headers are accepted
      - TRUSTED_PROXIES=172.16.0.0/12
      - PHP_MEMORY_LIMIT=512M
      - PHP_UPLOAD_LIMIT=10G
    logging:
      driver: syslog
      options:
        syslog-address: "udp://192.168.5.25:514"
        syslog-format: "rfc3164"
        tag: "nextcloud-app"
    depends_on:
      - db
      - redis

  db:
    image: mariadb:10.6
    container_name: nextcloud_db
    restart: unless-stopped
    networks:
      - frontend
    volumes:
      - ${DB_DIR}:/var/lib/mysql
    command: --transaction-isolation=READ-COMMITTED --binlog-format=ROW
    environment:
      - TZ=America/Los_Angeles
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD}
      - MYSQL_DATABASE=${DB_NAME}
      - MYSQL_USER=${DB_USER}
      - MYSQL_PASSWORD=${DB_PASSWORD}
    logging:
      driver: syslog
      options:
        syslog-address: "udp://192.168.5.25:514"
        syslog-format: "rfc3164"
        tag: "nextcloud-db"

  redis:
    image: redis:alpine
    container_name: nextcloud_redis
    restart: unless-stopped
    networks:
      - frontend
    logging:
      driver: syslog
      options:
        syslog-address: "udp://192.168.5.25:514"
        syslog-format: "rfc3164"
        tag: "nextcloud-redis"

networks:
  frontend:
    external: true
    name: frontend
