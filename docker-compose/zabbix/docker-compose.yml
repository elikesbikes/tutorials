services:
  zabbix-server:
    hostname: zabbix-server
    container_name: zabbix-server
    image: zabbix/zabbix-server-mysql:alpine-6.2-latest
    restart: unless-stopped
    volumes:
      - ./zbx_env/usr/lib/zabbix/alertscripts:/usr/lib/zabbix/alertscripts:ro
      - ./zbx_env/usr/lib/zabbix/externalscripts:/usr/lib/zabbix/externalscripts:ro
      - ./zbx_env/var/lib/zabbix/export:/var/lib/zabbix/export:rw
      - ./zbx_env/var/lib/zabbix/modules:/var/lib/zabbix/modules:ro
      - ./zbx_env/var/lib/zabbix/enc:/var/lib/zabbix/enc:ro
      - ./zbx_env/var/lib/zabbix/ssh_keys:/var/lib/zabbix/ssh_keys:ro
      - ./zbx_env/var/lib/zabbix/mibs:/var/lib/zabbix/mibs:ro
      - ./zbx_env/var/lib/zabbix/snmptraps:/var/lib/zabbix/snmptraps:rw
    environment:
      - TZ=America/Los_Angeles
      - DB_SERVER_HOST=zabbix-mysql
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - ZBX_JAVAGATEWAY_ENABLE=true
      - ZBX_STARTJAVAPOLLERS=5
      - ZBX_ENABLE_SNMP_TRAPS=true
    depends_on:
      - zabbix-mysql
    networks:
      - frontend
    logging:
      driver: syslog
      options:
        syslog-address: "udp://192.168.5.25:514"
        syslog-format: "rfc3164"
        tag: "zabbix-server"
    stop_grace_period: 30s
    sysctls:
      - net.ipv4.ip_local_port_range=1024 65000
      - net.ipv4.conf.all.accept_redirects=0
      - net.ipv4.conf.all.secure_redirects=0
      - net.ipv4.conf.all.send_redirects=0
    labels:
      com.zabbix.description: "Zabbix server with MySQL database support"
      com.zabbix.component: "zabbix-server"

  zabbix-web:
    hostname: zabbix-web
    container_name: zabbix-web
    image: zabbix/zabbix-web-nginx-mysql:alpine-6.2-latest
    restart: unless-stopped
    volumes:
      - ./zbx_env/etc/ssl/nginx:/etc/ssl/nginx:ro
      - ./zbx_env/usr/share/zabbix/modules:/usr/share/zabbix/modules:ro
    environment:
      - TZ=America/Los_Angeles
      - DB_SERVER_HOST=zabbix-mysql
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - ZBX_SERVER_HOST=zabbix-server
      - ZBX_SERVER_NAME=Homelab Zabbix
    depends_on:
      - zabbix-mysql
      - zabbix-server
    networks:
      - frontend
    logging:
      driver: syslog
      options:
        syslog-address: "udp://192.168.5.25:514"
        syslog-format: "rfc3164"
        tag: "zabbix-web"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.zabbix.rule=Host(`${ZABBIX_DOMAIN}`)"
      - "traefik.http.routers.zabbix.entrypoints=websecure"
      - "traefik.http.routers.zabbix.tls=true"
      - "traefik.http.routers.zabbix.tls.certresolver=production"
      - "traefik.http.services.zabbix.loadbalancer.server.port=8080"
    stop_grace_period: 10s
    sysctls:
      - net.core.somaxconn=65535

  zabbix-mysql:
    container_name: zabbix-mysql
    image: mariadb:10.5
    restart: unless-stopped
    hostname: zabbix-mysql
    command:
      - mysqld
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_bin
      - --skip-character-set-client-handshake
      - --default-authentication-plugin=mysql_native_password
    volumes:
      - ./zbx_env/var/lib/mysql:/var/lib/mysql:rw
    environment:
      - TZ=America/Los_Angeles
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
    stop_grace_period: 1m
    networks:
      - frontend
    logging:
      driver: syslog
      options:
        syslog-address: "udp://192.168.5.25:514"
        syslog-format: "rfc3164"
        tag: "zabbix-mysql"

  zabbix-agent:
    hostname: zabbix-agent
    container_name: zabbix-agent2
    image: zabbix/zabbix-agent:alpine-6.2-latest
    restart: unless-stopped
    volumes:
      - ./zbx_env/etc/zabbix:/etc/zabbix:rw
      - ./zbx_env/var/lib/zabbix/modules:/var/lib/zabbix/modules:ro
      - ./zbx_env/var/lib/zabbix/enc:/var/lib/zabbix/enc:ro
      - ./zbx_env/var/lib/zabbix/ssh_keys:/var/lib/zabbix/ssh_keys:ro
    environment:
      - TZ=America/Los_Angeles
      - ZBX_SERVER_HOST=zabbix-server
      - ZBX_PASSIVESERVERS=0.0.0.0/0
      - ZBX_HOSTNAME=zabbix-srv-agent
    networks:
      - frontend
    logging:
      driver: syslog
      options:
        syslog-address: "udp://192.168.5.25:514"
        syslog-format: "rfc3164"
        tag: "zabbix-agent"

networks:
  frontend:
    external: true
    name: frontend
